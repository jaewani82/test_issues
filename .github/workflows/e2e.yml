name: E2E Tests

# 코드가 main 브랜치에 푸시되거나 PR이 열릴 때 자동 실행
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. Python 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 의존 패키지 설치
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # 4. 테스트 실행
      #    --headless: CI 환경에는 모니터가 없으므로 headless 강제
      #    --tb=short: 실패 시 짧은 트레이스백만 출력
      #    -v: 각 TC 이름과 결과를 줄마다 출력
      - name: Run Playwright tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # FAIL 시 이슈 등록에 사용
          GITHUB_REPO: ${{ github.repository }}       # jaewani82/test_issues
        run: |
          pytest test_solarteq_all.py -v --tb=short \
            --override-ini="addopts=" \
            2>&1 | tee test_results.txt
        continue-on-error: true  # 테스트 실패해도 다음 step 계속 실행

      # 5. 결과 파일을 Artifact로 저장 (GitHub Actions 탭에서 다운로드 가능)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.txt
